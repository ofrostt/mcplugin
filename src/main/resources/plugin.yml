name: Duels
version: 2.1.0
main: dev.ofrostt.frostmenu.FrostMenu
api-version: '1.21.11'
description: Unified kit menus, native dialogs, and dedicated-server duels.
commands:
  duel:
    description: Challenge a player using the kit selection menu.
    usage: /duel <player>
  duels:
    description: Administrator kit, arena, and configuration management.
    usage: /duels help
    permission: duels.admin
permissions:
  duels.use:
    default: true
    description: Open /duel and respond to challenges using buttons.
  duels.admin:
    default: op
    description: Use /duels.
