menu-version: 3
# FrostDuels menu settings — Paper 1.21.11 / Java 21
# Text supports & color codes (including &l bold). No resource pack is required.
# Text placeholders: %player%, %target%, %gamemode%, %kit%, %rounds%, %map%, %map-name%.
# Use exact FrostDuels kit IDs. Create kits and arenas with /duels (administrators only).
# Map IDs are FrostDuels arena IDs; random selects a free arena.
# Advanced Options edits rules for this duel only. Server/kit defaults remain in config.yml.
# Slots are zero-based. Category and gamemode slots must be unique within each menu.
# Reload menu and gameplay config together with /duels reload.

session-timeout-seconds: 300
messages:
  usage: '&bDuels &8» &bInvalid arguments! Use: /duel <player>'
  players-only: '&cOnly players can open the duel menu.'
  no-permission: '&cYou do not have permission to do that.'
  player-not-found: '&cThat player is offline or unavailable.'
  self-duel: '&cYou cannot duel yourself.'
  expired: '&cThis menu has expired. Open /duel <player> again.'
  invalid-response: '&cChoose a valid whole number of rounds.'
  invalid-rules: '&cInvalid rules: use whole Y levels (-2032 to 2031), food/saturation 0–20, minimum <= maximum, and enable terrain damage before building, breaking or explosions.'
  request-failed: '&cCould not send the duel request. Ask an administrator to check the console.'
menus:
  show-lore: false
  hide-item-tooltips: true
  # Open kit pages directly. Page arrows change groups; kit arrows change the highlight.
  # Confirm opens the dialog. Clicking an icon only highlights it.
  navigation:
    enabled: true
    # Category IDs to show, in arrow-navigation order. Add custom category IDs here.
    page-order: [mctiers-io, subtiers]
    selected-lore: ''
    previous-page:
      material: ARROW
      display-name: '&ePrevious Kit Page'
      lore: []
      slot: 36
    next-page:
      material: ARROW
      display-name: '&eNext Kit Page'
      lore: []
      slot: 44
    previous-kit:
      material: ARROW
      display-name: '&ePrevious Kit'
      lore: []
      slot: 38
    next-kit:
      material: ARROW
      display-name: '&eNext Kit'
      lore: []
      slot: 42
    confirm:
      material: LIME_DYE
      display-name: '&aConfirm: %gamemode-name%'
      lore: []
      slot: 40
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    display-name: ' '
    lore: []
  categories:
    title: '&bSelect Kit Category'
    rows: 3
  back:
    material: ARROW
    display-name: '&eGo Back'
    lore: []
    slot: 44
dialog:
  width: 300
  button-width: 300
  slider-width: 300
  body-width: 300
  # Escape still closes the dialog when this is false.
  show-close-button: false
  title: '&6Confirm Duel!'
  body:
  - '&e%player% &7vs &e%target%'
  - '&7Kit: %kit-icon% &a&l%gamemode-name%'
  # Native item atlas sprites, not emoji characters. All icon paths are editable.
  icons:
    kit:
      atlas: minecraft:items
      sprite: minecraft:item/diamond_sword
    rounds:
      atlas: minecraft:items
      sprite: minecraft:item/lime_dye
    advanced:
      atlas: minecraft:items
      sprite: minecraft:item/book
    map:
      atlas: minecraft:items
      sprite: minecraft:item/map
  rounds:
    min: 1
    max: 20
    default: 1
    label: '%rounds-icon% &fRounds'
  buttons:
    advanced: '%advanced-icon% &fView Advanced Options'
    map: '%map-icon% &fMap Selector &6(%map-name%&6)'
    send: '%rounds-icon% &fSend Duel'
    close: '&c✕ Close'
    back: '&e← Back'
    apply: '&aApply'
  map-title: '&6Select Map'
  map-body: []
  advanced:
    title: '&6Advanced Options'
    body:
    - '&7Opponent: &e%target%'
    - '&7Kit ID: &a%kit%'
    - '&7First to &e%rounds% &7wins.'
    - '&7Map: &e%map-name%'
    - '&7Change the rules below, then click Apply.'
    - '&7Back discards unsaved edits. These rules affect this duel only.'
    - '&7Terrain damage must be enabled for building, breaking or explosions.'
    - '&7Terrain changes require an arena snapshot. Y limits are inclusive.'
    labels:
      saturation: '&bSaturation enabled'
      regeneration: '&bRegeneration enabled (master toggle)'
      natural-regeneration: '&bNatural regeneration'
      potion-regeneration: '&bPotion regeneration'
      hunger: '&bHunger enabled'
      terrain-damage: '&bTerrain damage enabled (master toggle)'
      building: '&bAllow placing blocks'
      breaking: '&bAllow breaking blocks'
      explosion-terrain-damage: '&bAllow explosion terrain damage'
      min-break-y: '&bMinimum mining Y'
      max-break-y: '&bMaximum mining Y'
      min-build-y: '&bMinimum building Y'
      max-build-y: '&bMaximum building Y'
      starting-food: '&bStarting food (0–20)'
      starting-saturation: '&bStarting saturation (0–20)'
maps:
  random: '&6Random'
categories:
  mctiers-io:
    material: RED_DYE
    display-name: '&amctiers.io'
    lore: []
    slot: 11
    title: '&8Queue: mctiers.io'
    rows: 5
    gamemodes: {}
  subtiers:
    material: YELLOW_DYE
    display-name: '&aSubtiers Kits'
    lore: []
    slot: 15
    title: '&8Queue: Subtiers'
    rows: 5
    gamemodes: {}
