# Dedicated duel server. Terrain edits need a saved arena snapshot before a match can start.
# Text uses & color codes. All FrostDuels chat text and request button labels live here.
# Kits, arenas and lobby are stored separately in data.yml. Never edit recovery/ manually.
request-expiry-seconds: 60
request-cooldown-seconds: 3
countdown-seconds: 3
round-time-limit-seconds: 600
max-rounds: 20
arena-padding-blocks: 16
protect-lobby: true
# Rules are global defaults; override any subset per exact kit ID under kit-rules.
# Y limits are inclusive. Place and break limits are independent of arena snapshot bounds.
# The arena snapshot must enclose the whole area players can change.
rules:
  saturation: true
  regeneration: true
  natural-regeneration: true
  potion-regeneration: true
  hunger: true
  starting-food: 20
  starting-saturation: 20.0
  terrain-damage: false
  building: false
  breaking: false
  explosion-terrain-damage: false
  min-break-y: -64
  max-break-y: 319
  min-build-y: -64
  max-build-y: 319
# Example override (uncomment and use your exact saved kit ID):
# kit-rules:
#   UHC-IO:
#     terrain-damage: true
#     building: true
#     breaking: true
#     natural-regeneration: false
#     min-break-y: 40
#     max-break-y: 100
#     min-build-y: 40
#     max-build-y: 120
kit-rules: {}
