# FrostMenu — Paper 1.21.11 / Java 21
# Text supports & color codes (including &l bold). No resource pack is required.
# Text placeholders: %player%, %target%, %gamemode%, %kit%, %rounds%, %map%, %map-name%.
# Command placeholders: %player%, %target%, %kit%, %rounds%, %map%.
# Commands run AS THE PLAYER, never as console. Keep FrostDuels permissions enabled.
# Use exact FrostDuels kit IDs. Create kits and arenas with /frostduels.
# Map IDs are FrostDuels arena IDs; random selects a free arena.
# Advanced Options is a configurable information page. Edit gameplay rules in FrostDuels/config.yml.
# Slots are zero-based. Category and gamemode slots must be unique within each menu.
# Restart after changing command aliases/permissions in plugin.yml; reload config with /frostmenu reload.

session-timeout-seconds: 300
integration:
  duel-command: frostduels:frostduels duel %target% %kit% %rounds% %map%
messages:
  usage: '&bFrostMenu &8» &7/frostmenu <player> or /frostmenu reload'
  players-only: '&cOnly players can open the duel menu.'
  no-permission: '&cYou do not have permission to do that.'
  player-not-found: '&cThat player is offline or unavailable.'
  self-duel: '&cYou cannot duel yourself.'
  reloaded: '&aFrostMenu configuration reloaded.'
  reload-failed: '&cConfiguration rejected. Previous settings kept; check the server console.'
  expired: '&cThis menu has expired. Open /frostmenu <player> again.'
  invalid-response: '&cChoose a valid whole number of rounds.'
  command-unavailable: '&cThe configured duel command is unavailable. Check that FrostDuels is installed.'
  command-failed: '&cThe duel command could not be processed. Check its usage and permissions.'
  dispatched: '&7Duel request command dispatched for %target% &7(kit: %kit%, rounds: %rounds%).'
menus:
  # Open kit pages directly. Page arrows change groups; kit arrows change the highlight.
  # Confirm opens the dialog. Clicking an icon only highlights it.
  navigation:
    enabled: true
    selected-lore: '&aSelected — press Confirm below'
    previous-page:
      material: ARROW
      display-name: '&ePrevious Kit Page'
      lore: ['&7Show the previous group of kits']
      slot: 36
    next-page:
      material: ARROW
      display-name: '&eNext Kit Page'
      lore: ['&7Show the next group of kits']
      slot: 44
    previous-kit:
      material: ARROW
      display-name: '&ePrevious Kit'
      lore: ['&7Move the highlight to the previous kit']
      slot: 38
    next-kit:
      material: ARROW
      display-name: '&eNext Kit'
      lore: ['&7Move the highlight to the next kit']
      slot: 42
    confirm:
      material: LIME_DYE
      display-name: '&aConfirm: %gamemode-name%'
      lore: ['&7Open the duel confirmation dialog']
      slot: 40
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
  categories:
    title: '&bSelect Kit Category'
    rows: 3
  back:
    material: ARROW
    display-name: '&eGo Back'
    lore:
    - '&7Return to category selection'
    slot: 44
dialog:
  width: 300
  button-width: 300
  slider-width: 300
  body-width: 300
  # Escape still closes the dialog when this is false.
  show-close-button: false
  title: '&6Confirm Duel!'
  body:
  - '&e%player% &7vs &e%target%'
  - '&7Kit: %kit-icon% &a&l%gamemode-name%'
  # Native item atlas sprites, not emoji characters. All icon paths are editable.
  icons:
    kit:
      atlas: minecraft:items
      sprite: minecraft:item/diamond_sword
    rounds:
      atlas: minecraft:items
      sprite: minecraft:item/lime_dye
    advanced:
      atlas: minecraft:items
      sprite: minecraft:item/book
    map:
      atlas: minecraft:items
      sprite: minecraft:item/map
  rounds:
    min: 1
    max: 20
    default: 1
    label: '%rounds-icon% &fRounds'
  buttons:
    advanced: '%advanced-icon% &fView Advanced Options'
    map: '%map-icon% &fMap Selector &6(%map-name%&6)'
    send: '%rounds-icon% &fSend Duel'
    close: '&c✕ Close'
    back: '&e← Back'
    apply: '&aApply'
  map-title: '&6Select Map'
  advanced:
    title: '&6Advanced Options'
    body:
    - '&7Opponent: &e%target%'
    - '&7Kit ID: &a%kit%'
    - '&7First to &e%rounds% &7wins.'
    - '&7Map: &e%map-name%'
    - '&7Arenas, kits, and match rules are managed by FrostDuels.'
maps:
  random: '&6Random'
