name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build and test unified plugin
        run: bash build-all.sh clean

      - name: Collect plugin JAR
        run: |
          mkdir -p dist
          cp target/FrostDuels-*.jar dist/

      - name: Upload downloadable plugins
        uses: actions/upload-artifact@v4
        with:
          name: FrostDuels
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30
