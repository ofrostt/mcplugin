name: Build plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Build and test unified plugin
        run: bash build-all.sh clean

      - name: Collect plugin JAR
        run: |
          mkdir -p dist
          cp target/Duels.jar dist/

      - name: Upload downloadable plugins
        uses: actions/upload-artifact@v4
        with:
          name: Duels
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct JAR download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          release_tag="build-${BUILD_COMMIT}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --target "$BUILD_COMMIT" --title "Duels — build ${GITHUB_RUN_NUMBER}" --notes "Download Duels.jar below and place it in your Paper 1.21.11 server plugins folder. Requires Java 21. See README for commands and migration details." --prerelease
          fi
          gh release upload "$release_tag" dist/Duels.jar --clobber
